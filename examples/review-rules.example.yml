# Claude PR Reviewer 설정 예시
# 이 파일을 리포지토리의 .github/review-rules.yml로 복사해서 사용하세요.

# 리뷰 코멘트를 작성할 언어 (생략하면 모델 기본 언어로 작성)
language: ko

# 코멘트 게시 방식: inline(라인별 코멘트) | summary(요약 코멘트 1개) | both
comment_style: both

# 리뷰에서 제외할 파일 glob 패턴.
# lock 파일(package-lock.json, yarn.lock 등)과 바이너리 파일은 별도 설정 없이 항상 제외됩니다.
ignore_patterns:
  - '**/*.generated.ts'
  - 'docs/**'

rules:
  - id: no-console-log
    description: '프로덕션 코드에 console.log를 남기지 마세요. 로거를 사용하세요.'
    applies_to:
      - 'src/**/*.ts'
    severity: warning

  - id: naming-camelcase
    description: '변수와 함수 이름은 camelCase를 사용합니다.'
    severity: info
