name: Claude PR Review

# fork에서 온 PR도 리뷰하려면 pull_request_target을 써야 한다 (pull_request는 fork PR에
# 시크릿을 주지 않고 GITHUB_TOKEN도 read-only라 이 액션이 아예 동작하지 않는다).
#
# pull_request_target이 안전한 이유:
# - 아래 checkout 스텝에 `ref:`를 지정하지 않았다 → 항상 base 브랜치(우리 코드)를 체크아웃한다.
#   PR의 head(공격자가 제어하는 코드)를 절대 체크아웃하지 않는다.
# - 이 액션(src/index.ts)은 GitHub API로 diff 텍스트만 읽어서 Claude 프롬프트에 넣고,
#   Claude의 JSON 응답을 코멘트로 남길 뿐, PR의 코드를 실행(checkout 후 build/test 등)하지
#   않는다. 즉 신뢰할 수 없는 입력이 "데이터"로만 흐르고 "코드"로 실행되지 않는다.
# - 위 두 조건이 깨지는 순간(예: PR head를 checkout해서 스크립트를 실행) 시크릿이 유출될 수
#   있으므로, 이 워크플로우를 수정할 때는 `ref: ${{ github.event.pull_request.head.sha }}`류의
#   변경을 추가하지 않는다.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base ref only — PR head는 절대 checkout하지 않음)
        uses: actions/checkout@v4

      - name: Claude PR Review
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
